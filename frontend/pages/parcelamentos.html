<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinPessoal – Parcelamentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <!-- ═══ SIDEBAR ═══ -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="fp-logo">FP</div>
      <span>FinPessoal</span>
    </div>
    <div class="sidebar-user" id="sidebarUser"></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"     class="nav-item">📊 Dashboard</a>
      <a href="receitas.html"      class="nav-item">💰 Receitas</a>
      <a href="despesas.html"      class="nav-item">💳 Despesas</a>
      <a href="parcelamentos.html" class="nav-item active">📅 Parcelamentos</a>
      <a href="previsao.html"      class="nav-item">🔮 Previsões</a>
      <a href="configuracoes.html" class="nav-item">⚙️ Configurações e Perfil</a>
    </nav>
    <button class="btn-sair" onclick="sair()">🚪 Sair</button>
  </div>
  <div class="overlay" id="overlay" onclick="fecharMenu()"></div>

  <div class="main-content">
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleMenu()">☰</button>
      <div class="topbar-info">
        <span id="saudacao">Parcelamentos</span>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <h1 class="page-title">📅 Parcelamentos</h1>
        <button class="btn-primario btn-sm" onclick="abrirModal()">+ Novo Parcelamento</button>
      </div>

      <div class="card-resumo-simples">
        <span>Total de parcelas ativas (por mês):</span>
        <strong id="totalParcelas" class="valor-negativo">R$ 0,00</strong>
      </div>

      <div id="listaParcelamentos" class="lista-itens">
        <p class="lista-vazia">Nenhum parcelamento cadastrado.</p>
      </div>
    </div>
  </div>

  <!-- MODAL PARCELAMENTO -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitulo">Novo Parcelamento</h3>
        <button onclick="fecharModal()" class="btn-fechar">✕</button>
      </div>
      <div id="erroModal" class="alerta alerta-erro hidden"></div>
      <div class="campo">
        <label>Descrição</label>
        <input type="text" id="parDescricao" placeholder="Ex: TV Samsung, Notebook..." />
      </div>
      <div class="campo-linha">
        <div class="campo">
          <label>Valor Total (R$)</label>
          <input type="number" id="parValorTotal" placeholder="0,00" step="0.01" oninput="calcularParcela()" />
        </div>
        <div class="campo">
          <label>Nº de Parcelas</label>
          <input type="number" id="parTotalParcelas" placeholder="12" min="1" oninput="calcularParcela()" />
        </div>
      </div>
      <div class="campo">
        <label>Valor da Parcela (R$)</label>
        <input type="number" id="parValorParcela" placeholder="Calculado automaticamente" step="0.01" />
      </div>
      <div class="campo">
        <label>Categoria</label>
        <select id="parCategoria"><option value="">Carregando...</option></select>
      </div>
      <div class="campo-linha">
        <div class="campo"><label>Mês de Início</label><select id="parMesInicio"></select></div>
        <div class="campo"><label>Ano de Início</label><select id="parAnoInicio"></select></div>
      </div>
      <button class="btn-primario" onclick="salvarParcelamento()">Salvar</button>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/parcelamentos.js"></script>
</body>
</html>
