<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinPessoal – Receitas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon-sm">₿</span><span>FinPessoal</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
      <a href="receitas.html" class="nav-item active">💰 Receitas</a>
      <a href="despesas.html" class="nav-item">💳 Despesas</a>
      <a href="parcelamentos.html" class="nav-item">📅 Parcelamentos</a>
      <a href="previsao.html" class="nav-item">🔮 Previsões</a>
    </nav>
    <button class="btn-sair" onclick="sair()">🚪 Sair</button>
  </div>
  <div class="overlay" id="overlay" onclick="fecharMenu()"></div>

  <div class="main-content">
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleMenu()">☰</button>
      <div class="topbar-info">
        <span id="saudacao">Receitas</span>
        <div class="mes-selector">
          <select id="selMes" onchange="carregarReceitas()"></select>
          <select id="selAno" onchange="carregarReceitas()"></select>
        </div>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <h1 class="page-title">💰 Receitas</h1>
        <button class="btn-primario btn-sm" onclick="abrirModal()">+ Nova Receita</button>
      </div>

      <div class="card-resumo-simples">
        <span>Total do mês:</span>
        <strong id="totalMes" class="valor-positivo">R$ 0,00</strong>
      </div>

      <div class="filtros-tipo">
        <button class="filtro-btn active" onclick="filtrarTipo('todos', this)">Todos</button>
        <button class="filtro-btn" onclick="filtrarTipo('fixo', this)">Fixas</button>
        <button class="filtro-btn" onclick="filtrarTipo('unico', this)">Únicos</button>
      </div>

      <div id="listaReceitas" class="lista-itens">
        <p class="lista-vazia">Nenhuma receita cadastrada neste mês.</p>
      </div>

      <!-- Receitas parceladas -->
      <div style="margin-top:28px">
        <div class="page-header">
          <h2 style="font-size:17px;font-weight:700;color:var(--text-dark)">📈 Recebimentos Parcelados</h2>
          <button class="btn-primario btn-sm" onclick="abrirModalParcelada()">+ Novo Parcelado</button>
        </div>
        <div id="listaReceitasParceladas" class="lista-itens">
          <p class="lista-vazia">Nenhum recebimento parcelado cadastrado.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL RECEITA NORMAL -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Nova Receita</h3>
        <button onclick="fecharModal()" class="btn-fechar">✕</button>
      </div>
      <div id="erroModal" class="alerta alerta-erro hidden"></div>
      <div class="campo">
        <label>Tipo de receita</label>
        <select id="recTipo">
          <option value="unico">Único (recebimento pontual)</option>
          <option value="fixo">Fixo (repete todo mês nas previsões)</option>
        </select>
      </div>
      <div class="campo">
        <label>Descrição</label>
        <input type="text" id="recDescricao" placeholder="Ex: Salário, Freela, Aluguel..." />
      </div>
      <div class="campo">
        <label>Valor (R$)</label>
        <input type="number" id="recValor" placeholder="0,00" step="0.01" min="0" />
      </div>
      <div class="campo">
        <label>Categoria / Origem</label>
        <select id="recCategoria">
          <option value="salario">Salário</option>
          <option value="freela">Freelance / Bico</option>
          <option value="aluguel">Aluguel recebido</option>
          <option value="investimento">Investimentos</option>
          <option value="pensao">Pensão / Benefício</option>
          <option value="presente">Presente / Doação</option>
          <option value="outros">Outros</option>
        </select>
      </div>
      <div class="campo-linha">
        <div class="campo">
          <label>Mês</label>
          <select id="recMes"></select>
        </div>
        <div class="campo">
          <label>Ano</label>
          <select id="recAno"></select>
        </div>
      </div>
      <button class="btn-primario" onclick="salvarReceita()">Salvar Receita</button>
    </div>
  </div>

  <!-- MODAL RECEITA PARCELADA -->
  <div class="modal-overlay hidden" id="modalParceladaOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Novo Recebimento Parcelado</h3>
        <button onclick="fecharModalParcelada()" class="btn-fechar">✕</button>
      </div>
      <div id="erroModalParcelada" class="alerta alerta-erro hidden"></div>
      <div class="campo">
        <label>Descrição</label>
        <input type="text" id="rpDescricao" placeholder="Ex: Venda do notebook, Acordo parcelado..." />
      </div>
      <div class="campo-linha">
        <div class="campo">
          <label>Valor Total (R$)</label>
          <input type="number" id="rpValorTotal" placeholder="0,00" step="0.01" oninput="calcularParcelaReceita()" />
        </div>
        <div class="campo">
          <label>Nº de Parcelas</label>
          <input type="number" id="rpTotalParcelas" placeholder="12" min="1" oninput="calcularParcelaReceita()" />
        </div>
      </div>
      <div class="campo">
        <label>Valor da Parcela (R$)</label>
        <input type="number" id="rpValorParcela" placeholder="Calculado automaticamente" step="0.01" />
      </div>
      <div class="campo">
        <label>Categoria</label>
        <select id="rpCategoria">
          <option value="venda">Venda</option>
          <option value="acordo">Acordo / Parcelamento</option>
          <option value="investimento">Investimento</option>
          <option value="outros">Outros</option>
        </select>
      </div>
      <div class="campo-linha">
        <div class="campo">
          <label>Mês de Início</label>
          <select id="rpMesInicio"></select>
        </div>
        <div class="campo">
          <label>Ano de Início</label>
          <select id="rpAnoInicio"></select>
        </div>
      </div>
      <button class="btn-primario" onclick="salvarReceitaParcelada()">Salvar</button>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/receitas.js"></script>
</body>
</html>
