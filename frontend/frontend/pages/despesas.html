<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinPessoal – Despesas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="fp-logo">FP</div><span>FinPessoal</span></div>
    <div class="sidebar-user" id="sidebarUser"></div>
    <div class="sidebar-mes" id="sidebarMesSel"></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"     class="nav-item">📊 Dashboard</a>
      <a href="receitas.html"      class="nav-item">💰 Receitas</a>
      <a href="despesas.html"      class="nav-item active">💳 Despesas</a>
      <a href="parcelamentos.html" class="nav-item">📅 Parcelamentos</a>
      <a href="previsao.html"      class="nav-item">🔮 Previsões</a>
      <a href="configuracoes.html" class="nav-item">⚙️ Configurações e Perfil</a>
    </nav>
    <button class="btn-sair" onclick="sair()">🚪 Sair</button>
  </div>
  <div class="overlay" id="overlay" onclick="fecharMenu()"></div>

  <div class="main-content">
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleMenu()">☰</button>
      <div class="topbar-info">
        <span id="saudacao">Despesas</span>
        <div class="mes-selector topbar-mes-desktop">
          <select id="selMes" onchange="onTopbarMesChange(atualizarTotalMes)"></select>
          <select id="selAno" onchange="onTopbarMesChange(atualizarTotalMes)"></select>
        </div>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <h1 class="page-title">💳 Despesas</h1>
        <button class="btn-primario btn-sm" onclick="abrirModal()">+ Nova Despesa</button>
      </div>

      <div class="card-resumo-simples">
        <span>Total do mês selecionado:</span>
        <strong id="totalMes" class="valor-negativo">R$ 0,00</strong>
      </div>

      <div class="filtros-tipo" id="filtrosTipo">
        <button class="filtro-btn active" onclick="filtrarTipo('todos',this)">Todos</button>
      </div>

      <div id="listaDespesas" class="lista-itens">
        <p class="lista-vazia">Nenhuma despesa cadastrada.</p>
      </div>
    </div>
  </div>

  <!-- MODAL DESPESA -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitulo">Nova Despesa</h3>
        <button onclick="fecharModal()" class="btn-fechar">✕</button>
      </div>
      <div id="erroModal" class="alerta alerta-erro hidden"></div>
      <div class="campo">
        <label>Descrição</label>
        <input type="text" id="despDescricao" placeholder="Ex: Aluguel, Mercado, Netflix..." />
      </div>
      <div class="campo">
        <label>Valor (R$)</label>
        <input type="number" id="despValor" placeholder="0,00" step="0.01" min="0" />
      </div>
      <div class="campo-linha">
        <div class="campo">
          <label>Categoria</label>
          <select id="despCategoria"><option value="">Carregando...</option></select>
        </div>
        <div class="campo">
          <label>Tipo</label>
          <select id="despTipo"><option value="">Carregando...</option></select>
        </div>
      </div>
      <div class="campo-linha">
        <div class="campo"><label>Mês</label><select id="despMes"></select></div>
        <div class="campo"><label>Ano</label><select id="despAno"></select></div>
      </div>
      <button class="btn-primario" onclick="salvarDespesa()">Salvar</button>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/despesas.js"></script>
</body>
</html>
